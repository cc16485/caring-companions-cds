  .rail-top { display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .rail-top label { font-size:12px; font-weight:600; color:var(--gray-600); }
  select, input[type=text] {
    font-family:inherit; font-size:13px; padding:7px 10px; border:1.5px solid var(--gray-300);
    border-radius:6px; background:#fff; color:inherit;
  }
  .bar { height:6px; background:var(--gray-200); border-radius:99px; overflow:hidden; }
  .bar span { display:block; height:100%; background:var(--accent); width:0; transition:width .35s ease; }

  .pip {
    flex:none; display:flex; align-items:center; gap:7px; padding:6px 11px; border-radius:99px;
    border:1.5px solid var(--gray-300); background:#fff; cursor:pointer;
    font:600 11.5px Poppins,sans-serif; color:var(--gray-600); white-space:nowrap;
  }
  .pip:hover { border-color:var(--accent); color:var(--primary); }
  .pip.active { background:var(--primary); border-color:var(--primary); color:#fff; }
  .pip.done { border-color:var(--success); color:var(--success); }
  .pip.done.active { background:var(--success); border-color:var(--success); color:#fff; }

  /* ---------- layout ---------- */
  .wrap { max-width:940px; margin:0 auto; padding:24px; }

  .badges { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 16px; }

  .copyrow {

  .copyrow .k { font-size:11.5px; font-weight:700; color:var(--gray-600); min-width:104px; }

  .copybtn {

  .tip {
    background:var(--success-pale); border-left:4px solid var(--accent);

  .note {

  .say {

  /* ---------- screenshot slot ---------- */
  .shots { display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); margin-bottom:10px; }

  .dropzone {

  }
  .dropzone:hover { border-color:var(--accent); color:var(--primary); }

  /* ---------- step footer ---------- */
  .stepfoot {
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    border-top:1px solid var(--gray-200); margin-top:20px; padding-top:16px;

  .btn {

  .donebox {

  .spacer { flex:1; }

  /* ---------- diagram ---------- */
  .diagram { width:100%; height:auto; margin:6px 0 14px; }
  .diagram text { font-family:'Poppins',sans-serif; }

  /* ---------- AI help ---------- */
  .helpfab {
    position:fixed; right:20px; bottom:20px; z-index:60;
    background:var(--primary); color:#fff; border:none; border-radius:99px;
    padding:13px 20px; font:600 13.5px Poppins,sans-serif; cursor:pointer;
    box-shadow:0 4px 18px rgba(0,0,0,.28); display:flex; align-items:center; gap:8px;
  }
  .helpfab:hover { background:var(--primary-light); }
  .helppanel {
    position:fixed; right:20px; bottom:20px; z-index:61; width:min(420px,calc(100vw - 40px));
    height:min(560px,calc(100vh - 40px)); background:#fff; border-radius:12px;
    box-shadow:0 10px 40px rgba(0,0,0,.3); display:none; flex-direction:column; overflow:hidden;
  }
  .helppanel.open { display:flex; }
  .helphead {
    background:var(--primary); color:#fff; padding:13px 16px; display:flex; align-items:center; gap:10px;
  }
  .helphead b { font-size:14px; flex:1; }
  .helphead button { background:none; border:none; color:#fff; font-size:20px; cursor:pointer; line-height:1; }
  .helplog { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:11px; }
  .msg { font-size:13.5px; padding:10px 13px; border-radius:10px; max-width:88%; white-space:pre-wrap; }
  .msg.u { background:var(--primary); color:#fff; align-self:flex-end; border-bottom-right-radius:3px; }
  .msg.a { background:var(--gray-100); align-self:flex-start; border-bottom-left-radius:3px; }
  .msg.err { background:var(--danger-pale); color:var(--danger); align-self:flex-start; }
  .helpsuggest { display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 10px; }
  .helpsuggest button {
    font:500 11.5px Poppins,sans-serif; background:#fff; border:1.5px solid var(--gray-300);
    border-radius:99px; padding:5px 11px; cursor:pointer; color:var(--primary); text-align:left;
  }
  .helpsuggest button:hover { border-color:var(--accent); }
  .helpform { display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--gray-200); }
  .helpform input { flex:1; }

  .lightbox {
    position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:80; display:none;

</style>

<script>
// ============================================================
// SETUP
// Same Supabase project and same origin as the hub, so the sign-in already in
// the browser carries over. No second login.
// ============================================================
const SUPABASE_URL      = 'https://siivpekcaryeyttszwav.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_iDJ00Ve4hw5iw2YtVmiulg__FmjShmO';
const AGENCY_ID         = 'caring-companions-cds';
const HELP_FN           = 'https://zngsgedlsxinbygwmxwn.supabase.co/functions/v1/tax-help';
const SHOT_BUCKET       = 'ein-proof';   // screenshots live under a _training/ prefix

let _db = null, _consumers = [], _current = null, _shots = {}, _stepIdx = 0;

// ============================================================
// THE STEPS
// Two tracks, deliberately separated. Conflating them is why this feels
// unmanageable: the audit needs two numbers and one document, while the payroll
// forms are a different obligation on a different clock.
//
// `field` is the consumer record field that marks the step satisfied. The
// training reads and writes the SAME fields the tracker uses, so completion is
// never tracked in two places and cannot drift.
// ============================================================
const STEPS = [
  {
    id:'triage', track:'audit', pip:'Triage', title:'Work out what this consumer actually needs',
    field:null,
    badges:[['b-time','5 minutes']],
    body:`
      <p>Before doing anything, find out which of three situations you are in. Most people waste time here by
      assuming every consumer needs the full set of forms. They do not.</p>
      ${diagramTriage()}
      <h3>Ask in this order</h3>
      <ol class="do">
        <li><b>Does Fusion already hold proof for them?</b> Participant → Documents tab → look under
            <b>EIN Tax Documents</b>. A previous CDS vendor may have uploaded it, in which case you do not need
            to upload anything at all. Just make sure both numbers are typed in (step&nbsp;5).</li>
        <li><b>Do we know their Federal EIN?</b> Check Empeon and the consumer's file.
            <span style="color:var(--danger)"><b>Careful:</b> if Empeon shows <code>12-3456789</code>, that is a
            placeholder, not a real EIN. Treat it as no EIN.</span></li>
        <li><b>Do we hold a document showing it?</b> A filed 941 or 940, a CP&nbsp;575, a 147C, or any IRS letter
            with their legal name and number on it.</li>
      </ol>
      <div class="tip"><b>Shortcut worth checking first.</b> We are the 2678 agent, so we have been filing
        <b>941s</b> for these consumers. Form 941 is on the accepted proof list. If you can pull a filed return,
        the proof already exists and there is nothing to obtain.</div>
      <div class="note"><b>One unresolved point.</b> The policy lists Form 941 as acceptable but also says
        "computer printed forms are not acceptable". Those pull in opposite directions for a return we filed
        ourselves. Get the answer in writing from <b>QIQA@health.mo.gov</b> before relying on it.</div>`,
    copy:[['Audit questions','QIQA@health.mo.gov'],['Fusion logins','HCBS.Systems@health.mo.gov']]
  },
  {
    id:'proof', track:'audit', pip:'Get proof', title:'Get proof of the Federal EIN',
    field:'proofDocType',
    badges:[['b-phone','Phone call'],['b-online','Often same day'],['b-time','20 min per consumer']],
    body:`
      <p>This is for a consumer who <b>has</b> an EIN but where we cannot find the paperwork. If they have no
      EIN at all, skip to the next step instead.</p>
      <div class="gotcha"><b>The CP 575 is issued once and never reissued.</b> If it is lost it is gone. The
        replacement is a <b>147C letter</b>, and you get it by telephone. Do not spend days hunting for a
        CP&nbsp;575 that will never arrive.</div>
      <h3>Do this</h3>
      <ol class="do">
        <li>Call the IRS <b>Business and Specialty Tax Line</b> on <b>800-829-4933</b>, weekdays. Expect to hold.</li>
        <li>Have ready: the consumer's legal name, home address, and SSN or EIN.</li>
        <li>Tell them what you need:
          <div class="say">I am the authorized agent under Form 2678 for this taxpayer, and I need a 147C letter
          confirming their EIN. Can you fax it to me while I am on the line?</div></li>
        <li><b>Ask for the fax while you are still on the call.</b> Waiting for post costs weeks.</li>
        <li>Save the letter as a PDF, then attach it to the consumer in the hub so we keep our own copy.</li>
      </ol>
      <div class="gotcha"><b>They will refuse if we are not authorized.</b> The IRS will not release an EIN letter
        without a <b>2678</b> or <b>8821</b> on file for that consumer. If you get refused for that reason, do not
        argue on the phone. Note it and flag it, because that consumer needs the authorization filed first.</div>
      <h3>What counts as proof</h3>
      <ul class="plain">
        <li><b>Federal:</b> CP&nbsp;575, 147C, Form 940, Form 941, 8109 coupon, an IRS letter showing the tax ID
            and legal name, or any IRS document with the name and number <b>preprinted</b>.</li>
        <li><b>Missouri:</b> a copy of the Department of Revenue notice, MO&nbsp;941, or MO&nbsp;W-3.</li>
        <li><b>Never:</b> a W-9, or anything we typed or printed ourselves.</li>
      </ul>`,
    copy:[['IRS EIN letters','800-829-4933']]
  },
  {
    id:'ein', track:'audit', pip:'Federal EIN', title:'Get a Federal EIN from scratch',
    field:'ein',
    badges:[['b-online','Online, instant'],['b-time','15 minutes'],['b-time','Weekdays only']],
    body:`
      <p>For a consumer with no EIN at all, including anyone showing Empeon's placeholder
      <code>12-3456789</code>. This is the longest path, because Missouri cannot issue a Tax ID until the IRS
      issues the EIN, so start these before anything easier.</p>
      <div class="note"><b>The consumer is the employer.</b> This EIN belongs to them, not to Caring Companions,
        and it travels with them if they move to another agency. Use <b>their</b> name, address and SSN
        throughout, and list them as the responsible party.</div>
      <h3>Do this</h3>
      <ol class="do">
        <li>Go to <b>irs.gov</b> → <b>Tools</b> → <b>Apply for an Employer ID Number (EIN)</b> → <b>Apply Online Now</b>.</li>
        <li>The application is only open <b>weekdays, roughly 7am to 10pm Eastern</b>. It is not available at
            weekends, and it times out after about 15 minutes of inactivity, so gather everything first.</li>
        <li>Entity type: <b>Individual / Sole Proprietor</b>.</li>
        <li>Reason for applying: <b>Hired employees</b>.</li>
        <li>Enter the consumer's legal name, SSN and home address.</li>
        <li>Work through to the end. The EIN is issued <b>immediately</b> on the final screen.</li>
        <li><b>Save and print the confirmation before you close that window.</b></li>
      </ol>
      <div class="gotcha"><b>You cannot get back into that session.</b> If you close it without saving, the letter
        is not retrievable online, and applying again creates a duplicate EIN for that person, which is its own
        mess to unwind. Save the PDF first, then close.</div>
      <div class="note"><b>Ask before you rely on the printout.</b> Whether the printed online confirmation is
        acceptable to DHSS as proof, or whether they want the mailed CP&nbsp;575, is one of the two questions to put
        to <b>QIQA@health.mo.gov</b>. If they want the CP&nbsp;575, there is a postal wait attached to every one
        of these, which is the main reason to start them now.</div>`,
    copy:[['Apply for an EIN','https://www.irs.gov/businesses/small-businesses-self-employed/apply-for-an-employer-identification-number-ein-online'],['Placeholder to watch for','12-3456789']]
  },
  {
    id:'motax', track:'audit', pip:'MO Tax ID', title:'Register the Missouri Tax ID (form 2643A)',
    field:'moTaxId',
    badges:[['b-online','Online at dor.mo.gov'],['b-time','Needs the EIN first']],
    body:`
      <p>This registers the consumer with the Missouri Department of Revenue for state income tax withholding.
      Ten of our eleven consumers are missing this, so it is the bulk of the work.</p>
      <div class="note"><b>This cannot start until the federal EIN exists.</b> That dependency is the whole reason
        the no-EIN consumers have to be started first.</div>
      <h3>Do this</h3>
      <ol class="do">
        <li>Go to <b>dor.mo.gov</b> and register using form <b>2643A</b>. Online is faster than posting it.</li>
        <li>Use the consumer's <b>EIN, SSN, legal name and home address</b>.</li>
        <li>Business type: <b>Individual / household employer</b>.</li>
        <li>Submit. Missouri returns the consumer's <b>withholding tax ID</b>.</li>
        <li>Enter that number against the consumer in the hub.</li>
        <li><b>Keep the notice they send back.</b> That notice is the accepted Missouri proof, so file it with the
            consumer's documents and attach a copy in the hub.</li>
      </ol>
      <div class="tip"><b>One document can cover both.</b> If a single document shows the federal EIN
        <em>and</em> the Missouri number, it satisfies both requirements and you do not need a second upload.</div>`,
    copy:[['MO Dept of Revenue','https://dor.mo.gov'],['Registration questions','573-751-5860'],['Registration email','businesstaxregister@dor.mo.gov']]
  },
  {
    id:'fusion', track:'audit', pip:'Enter in Fusion', title:'Type both numbers into Fusion',
    field:'fusionEntered',
    badges:[['b-online','In Fusion'],['b-time','2 minutes']],
    body:`
      <p>Half of what the audit checks. Quick, and easy to think you have done when you have not.</p>

(async function boot() {
  _db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: { session } } = await _db.auth.getSession();
  if (!session) { document.getElementById('gate').style.display = 'block'; return; }
  document.getElementById('app').style.display = 'block';

  const { data } = await _db.from('agency_data')
    .select('data_key, data_value').eq('agency_id', AGENCY_ID)
    .in('data_key', ['consumers', 'taxTrainingShots']);
  (data || []).forEach(r => {
    if (r.data_key === 'consumers' && Array.isArray(r.data_value)) _consumers = r.data_value;
    if (r.data_key === 'taxTrainingShots' && r.data_value) _shots = r.data_value;
  });

  const sel = document.getElementById('consumerPick');
  sel.innerHTML = '<option value="">Just reading through (no consumer)</option>' +
    _consumers.filter(c => (c.status || 'active') !== 'inactive')
      .sort((a, b) => a.name.localeCompare(b.name))
      .map(c => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join('');

  // The bucket is private, so each screenshot needs a signed URL before it renders.
  await signShots();
  renderSuggestions();
  pickConsumer();
})();

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

// ============================================================
// STATE
// A step counts as done when the consumer's own record says so, reading the very
// same fields the Tax & EIN page uses. Nothing is tracked twice.
// ============================================================
function isDone(step) {
  if (!_current || !step.field) return false;
  const v = _current[step.field];
  return typeof v === 'boolean' ? v : !!(v && String(v).trim());
}

function pickConsumer() {
  const id = document.getElementById('consumerPick').value;
  _current = _consumers.find(c => c.id === id) || null;
  const hint = document.getElementById('laneHint');
  if (!_current) {
    hint.textContent = 'Pick a consumer to track progress against their record.';
  } else {
    const ein = !!(_current.ein || '').trim();
    const mo  = !!(_current.moTaxId || '').trim();
    hint.innerHTML = (ein ? '✓ has EIN' : '<b style="color:var(--danger)">no EIN</b>') + ' · ' +
                     (mo ? '✓ has MO Tax ID' : '<b style="color:var(--danger)">no MO Tax ID</b>');
  }
  renderRail();
  showStep(_stepIdx);
}

function renderRail() {
  const done = STEPS.filter(isDone).length;
  const pct = Math.round(done / STEPS.length * 100);
  document.getElementById('progBar').style.width = pct + '%';
  document.getElementById('progLabel').textContent = _current
    ? done + ' of ' + STEPS.length + ' steps recorded for ' + _current.name + ' (' + pct + '%)'
    : 'Reading mode. Pick a consumer above to record progress.';
  document.getElementById('stepsRail').innerHTML = STEPS.map((s, i) =>
    '<button class="pip' + (i === _stepIdx ? ' active' : '') + (isDone(s) ? ' done' : '') +
    '" onclick="showStep(' + i + ')"><span class="tick">' + (isDone(s) ? '✓' : (i + 1)) + '</span>' +
    esc(s.pip) + '</button>').join('');
}

function showStep(i) {
  _stepIdx = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[_stepIdx];
  const done = isDone(s);
  const shots = _shots[s.id] || [];

  document.getElementById('stepHost').innerHTML =
    '<div class="card step">' +
      '<div class="track-tag ' + (s.track === 'audit' ? 'track-audit">Required for the DHSS audit' :
                                 'track-payroll">Payroll setup · not audited') + '</div>' +
      '<h2>' + esc(s.title) + '</h2>' +
      '<div class="badges">' + s.badges.map(b => '<span class="badge ' + b[0] + '">' + esc(b[1]) + '</span>').join('') + '</div>' +
      s.body +
      (s.copy.length ? '<h3>Details you will need</h3>' + s.copy.map(c =>
        '<div class="copyrow"><span class="k">' + esc(c[0]) + '</span><span class="v">' + esc(c[1]) + '</span>' +
        '<button class="copybtn" onclick="copyVal(this,' + JSON.stringify(c[1]).replace(/"/g, '&quot;') + ')">Copy</button></div>').join('') : '') +
      '<h3>Screenshots for this step</h3>' +
      '<p class="muted">Add a real screen capture the first time you do this, and everyone after you sees it.</p>' +
      (shots.length ? '<div class="shots">' + shots.map(sh =>
          '<div class="shot"><img src="' + esc(sh.url) + '" alt="" onclick="zoom(this.src)">' +
          '<div class="cap"><span>' + esc(sh.name) + '</span>' +
          '<button onclick="removeShot(\'' + s.id + '\',\'' + esc(sh.path) + '\')">Remove</button></div></div>').join('') + '</div>' : '') +
      '<div class="dropzone" onclick="document.getElementById(\'shotInput\').click()">' +
        '📷 Click to add a screenshot of this step' +
      '</div>' +
      '<input type="file" id="shotInput" accept="image/png,image/jpeg,image/heic" style="display:none" ' +
        'onchange="uploadShot(event,\'' + s.id + '\')">' +
      '<div id="shotStatus" class="muted" style="margin-top:6px"></div>' +
      '<div class="stepfoot">' +
        '<button class="btn btn-outline" onclick="showStep(' + (_stepIdx - 1) + ')"' +
          (_stepIdx === 0 ? ' disabled' : '') + '>← Back</button>' +
        (s.field ? '<label class="donebox"><input type="checkbox"' + (done ? ' checked' : '') +
            (_current ? '' : ' disabled') + ' onchange="toggleDone()">' +
            (_current ? 'Done for ' + esc(_current.name) : 'Pick a consumer to tick this off') + '</label>'
          : '<span class="muted">Nothing to record on this step.</span>') +
        '<span class="spacer"></span>' +
        '<button class="btn" onclick="showStep(' + (_stepIdx + 1) + ')"' +
          (_stepIdx === STEPS.length - 1 ? ' disabled' : '') + '>Next step →</button>' +
      '</div>' +
    '</div>';
  renderRail();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Writes to the same consumer field the tracker reads, so ticking here shows up
// on the Tax & EIN page immediately. Date fields get today's date rather than a
// boolean, matching what that page expects.
async function toggleDone() {
  const s = STEPS[_stepIdx];
  if (!_current || !s.field) return;
  const cur = _current[s.field];
  const isDate = s.field === 'proofUploaded' || s.field === 'empeonUpdated';
  const isText = s.field === 'ein' || s.field === 'moTaxId' || s.field === 'proofDocType';

  if (isText && !(cur && String(cur).trim())) {
    alert('Enter the actual value on the Tax & EIN page for ' + _current.name +
          ', rather than ticking it here. This step is marked done once the number or document is recorded.');
    showStep(_stepIdx);
    return;
  }
  _current[s.field] = isDate ? (cur ? '' : new Date().toISOString().slice(0, 10)) : !cur;

  const { error } = await _db.from('agency_data')
    .upsert({ agency_id: AGENCY_ID, data_key: 'consumers', data_value: _consumers },
            { onConflict: 'agency_id,data_key' });
  if (error) { alert('Could not save that: ' + error.message); return; }
  showStep(_stepIdx);
}

function copyVal(btn, val) {
  navigator.clipboard.writeText(val).then(() => {
    const t = btn.textContent; btn.textContent = '✓ Copied';
    setTimeout(() => { btn.textContent = t; }, 1600);
  });
}

function zoom(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}

// ============================================================
// SCREENSHOTS
// Stored in the existing private 'ein-proof' bucket under a _training/ prefix,
// so no new bucket or policies are needed. Displayed via signed URLs.
// ============================================================
async function uploadShot(event, stepId) {
  const file = event.target.files[0];
  if (!file) return;
  const status = document.getElementById('shotStatus');
  status.textContent = 'Uploading ' + file.name + '…';
  try {
    const ext = (file.name.split('.').pop() || 'png').toLowerCase();
    const path = '_training/' + stepId + '/' + Date.now() + '.' + ext;
    const { error } = await _db.storage.from(SHOT_BUCKET).upload(path, file, { upsert: false });
    if (error) throw error;
    _shots[stepId] = (_shots[stepId] || []).concat([{ path, name: file.name }]);
    await saveShots();
    await signShots();
    showStep(_stepIdx);
  } catch (e) {
    status.textContent = 'Upload failed: ' + (e.message || 'unknown error');
  } finally { event.target.value = ''; }
}

async function removeShot(stepId, path) {
  if (!confirm('Remove this screenshot?')) return;
  await _db.storage.from(SHOT_BUCKET).remove([path]);
  _shots[stepId] = (_shots[stepId] || []).filter(s => s.path !== path);
  await saveShots();
  showStep(_stepIdx);
}

function saveShots() {
  const bare = {};
  Object.keys(_shots).forEach(k => { bare[k] = _shots[k].map(s => ({ path: s.path, name: s.name })); });
  return _db.from('agency_data').upsert(
    { agency_id: AGENCY_ID, data_key: 'taxTrainingShots', data_value: bare },
    { onConflict: 'agency_id,data_key' });
}

// The bucket is private, so every image needs a signed URL before it can render.
async function signShots() {
  for (const k of Object.keys(_shots)) {
    for (const s of _shots[k]) {
      if (s.url) continue;
      const { data } = await _db.storage.from(SHOT_BUCKET).createSignedUrl(s.path, 3600);
      if (data) s.url = data.signedUrl;
    }
  }
}

// ============================================================
// AI HELP
// ============================================================
const SUGGESTIONS = [
  'Does a filed 941 count as proof of the EIN?',
  'What do I say when I call the IRS for a 147C?',
  'Empeon shows 12-3456789 for this consumer. What now?',
  'Which forms does the audit actually require?',
  'Can I do the DES registration yet?',
  'What is not acceptable as proof?'
];
let _chat = [];

function renderSuggestions() {
  document.getElementById('helpSuggest').innerHTML = SUGGESTIONS.map(q =>
    '<button onclick="quickAsk(' + JSON.stringify(q).replace(/"/g, '&quot;') + ')">' + esc(q) + '</button>').join('');
}

function toggleHelp(open) {
  document.getElementById('helpPanel').classList.toggle('open', open);
  document.getElementById('helpFab').style.display = open ? 'none' : 'flex';
  if (open && !_chat.length) {
    addMsg('a', "Ask me anything about the consumer tax setup or the DHSS audit. I know the procedure this " +
                "training covers, including what counts as proof and what does not.\n\nI am not a tax adviser, " +
                "so anything beyond this procedure should go to your accountant.");
  }
  if (open) document.getElementById('helpInput').focus();
}

function addMsg(role, text) {
  const log = document.getElementById('helpLog');
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function quickAsk(q) {
  toggleHelp(true);
  document.getElementById('helpInput').value = q;
  askHelp(new Event('submit'));
}

async function askHelp(e) {
  if (e && e.preventDefault) e.preventDefault();
  const input = document.getElementById('helpInput');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  addMsg('u', q);
  _chat.push({ role: 'user', content: q });
  const send = document.getElementById('helpSend');
  send.disabled = true;
  const thinking = addMsg('a', 'Thinking…');

  try {
    const { data: { session } } = await _db.auth.getSession();
    if (!session) throw new Error('Your session expired. Reload the page.');
    // Give the assistant the consumer's situation so answers are specific.
    const ctx = _current
      ? '[Context: working on ' + _current.name + '. EIN ' + (_current.ein ? 'on file' : 'MISSING') +
        ', MO Tax ID ' + (_current.moTaxId ? 'on file' : 'MISSING') +
        ', currently on the step: ' + STEPS[_stepIdx].title + '.]\n'
      : '';
    const res = await fetch(HELP_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
      body: JSON.stringify({ messages: _chat.map((m, i) =>
        i === _chat.length - 1 ? { role: m.role, content: ctx + m.content } : m) })
    });
    const body = await res.json().catch(() => ({}));
    thinking.remove();
    if (body.reply) {
      addMsg('a', body.reply);
      _chat.push({ role: 'assistant', content: body.reply });
    } else {
      addMsg('err', body.error || 'No answer came back. Try again shortly.');
    }
  } catch (err) {
    thinking.remove();
    addMsg('err', err.message || 'Something went wrong.');
  } finally {
    send.disabled = false;
  }
}
