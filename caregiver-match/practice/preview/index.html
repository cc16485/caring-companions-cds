<meta charset="utf-8">
<title>CDS Caregiver Match Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/match/match.css">
<link rel="stylesheet" href="office/hub-match.css">
<style>
  /* Single light look on purpose: it matches the live findcdscaregivers.com site. */
  :root{color-scheme:light}
  html,body{background:#f3f1ec}
  body{font-size:16px}
  .px-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:90;background:#092842;color:#fff;padding:8px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px))}
  .px-bar .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
  .px-tag{font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:8px}
  .px-tag i{width:9px;height:9px;border-radius:50%;background:#f0a830;display:inline-block}
  .px-nav{display:flex;gap:4px;flex-wrap:wrap}
  .px-nav button{font:inherit;font-size:.88rem;font-weight:600;color:rgba(255,255,255,.8);background:transparent;border:0;border-radius:999px;padding:.45rem .9rem;min-height:40px;cursor:pointer}
  .px-nav button[aria-current="true"]{background:#54bdb8;color:#08343a}
  .px-reset{font:inherit;font-size:.8rem;color:rgba(255,255,255,.75);background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:.3rem .7rem;cursor:pointer;min-height:36px}
  .px-who{max-width:1180px;margin:12px auto 0;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .px-who span{font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5a6570}
  .px-who button{font:inherit;font-size:.9rem;font-weight:600;border:1.5px solid #e6e2da;background:#fff;color:#0e3860;border-radius:999px;padding:.35rem .9rem;min-height:40px;cursor:pointer}
  .px-who button[aria-pressed="true"]{border-color:#0e3860;background:#0e3860;color:#fff}
  .px-device{max-width:440px;margin:14px auto 40px;background:#fbfaf7;border:1px solid #e6e2da;border-radius:28px;box-shadow:0 20px 50px -30px rgba(14,56,96,.5);overflow:hidden;min-height:70vh}
  .px-device.wide{max-width:none;border-radius:0;border:0;box-shadow:none;margin:0;background:#fbfaf7}
  .px-device .cm-app{padding-bottom:40px}
  @media (max-width:480px){.px-device{border-radius:0;border-left:0;border-right:0;margin-top:10px}}
  .px-guide{max-width:820px;margin:18px auto 60px;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
  .px-guide .cm-card ol,.px-guide .cm-card ul{margin:0;padding-left:20px;display:grid;gap:6px}
  .px-loading{max-width:520px;margin:60px auto;text-align:center;color:#5a6570;display:grid;gap:10px;padding:0 16px}
  .px-loading .sp{width:34px;height:34px;border-radius:50%;border:4px solid #e6e2da;border-top-color:#2f8b86;margin:0 auto;animation:px-spin 1s linear infinite}
  @keyframes px-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.px-loading .sp{animation:none}}
</style>

<div class="px-bar"><div class="in">
  <span class="px-tag"><i></i>Practice mode · CDS Caregiver Match · fictional people · nothing is sent</span>
  <nav class="px-nav" aria-label="View as">
    <button data-v="guide">Start here</button>
    <button data-v="public">Public page</button>
    <button data-v="caregiver">Caregiver</button>
    <button data-v="family">Family</button>
    <button data-v="office">Office (CDS Hub)</button>
  </nav>
  <button class="px-reset" id="reset">Reset practice data</button>
</div></div>
<div id="who"></div>
<div id="stage"><div class="px-loading"><div class="sp"></div><b>Setting up practice mode</b><span>Loading the practice database and fictional caregivers. The first time takes about 15 seconds while it builds the practice data. After that it opens quickly.</span></div></div>

<script type="module">
import { practice, api, familySessionKey } from './assets/match/api.js';
import { mountPublic } from './assets/match/public-app.js';
import { mountCaregiver } from './assets/match/caregiver-app.js';
import { mountFamily } from './assets/match/family-app.js';
import { mountHubMatch } from './office/hub-match.js';

const KEY = 'cds-practice-shell-v2';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
const save = s => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} };
const st = Object.assign({ view: 'guide', cg: 'teresa', fam: 'ruth', extraCg: {}, extraFam: {} }, load());
const stage = document.getElementById('stage'), who = document.getElementById('who');
let P;
try { P = await practice(); }
catch (e) {
  stage.innerHTML = `<div class="px-loading"><b>Practice mode couldn't start in this browser</b><span>${String(e && e.message || e).replace(/</g, '&lt;')}</span></div>`;
  throw e;
}
const CG = { teresa: 'Teresa · screening complete', brenda: 'Brenda · screening complete', jordan: 'Jordan · availability 38 days old', marisol: 'Marisol · screening pending', luis: 'Luis · registration steps sent', kayla: 'Kayla · profile waiting for review' };
const FAM = { ruth: 'Ruth · prospect, 3 requests', ann: 'Ann · active CDS consumer', dale: 'Dale and June · invited, not signed in' };

function show() {
  save(st);
  document.querySelectorAll('.px-nav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.v === st.view)));
  who.innerHTML = ''; stage.innerHTML = '';
  const dev = document.createElement('div'); dev.className = 'px-device';
  if (st.view === 'guide') return guide();
  if (st.view === 'office') { dev.classList.add('wide'); stage.appendChild(dev);
    return mountHubMatch(dev, { api: (a, i) => api('staff', a, i), practice: true, onOpenLink: openLink }); }
  if (st.view === 'public') { dev.classList.add('wide'); stage.appendChild(dev); const nav = v => { dev.innerHTML = ''; mountPublic(dev, { view: v, onNavigate: nav }); window.scrollTo({ top: 0 }); }; return nav('landing'); }
  if (st.view === 'caregiver') {
    const all = { ...Object.fromEntries(Object.keys(st.extraCg).map(k => [k, st.extraCg[k].label])), ...CG };
    picker('Caregiver', all, st.cg, k => { st.cg = k; show(); });
    const link = st.extraCg[st.cg] ? st.extraCg[st.cg].link : P.meta.caregiverLinks[st.cg];
    stage.appendChild(dev);
    if (!link) { dev.innerHTML = '<div class="cm-app"><div class="cm-card">This caregiver has no private link yet. In the Office view, finish their office review and send the profile link.</div></div>'; return; }
    return mountCaregiver(dev, { link, view: st.cgView || 'home' }), (st.cgView = null);
  }
  if (st.view === 'family') {
    const all = { ...Object.fromEntries(Object.keys(st.extraFam).map(k => [k, st.extraFam[k].label])), ...FAM };
    picker('Family', all, st.fam, k => { st.fam = k; show(); });
    const invite = st.extraFam[st.fam] ? st.extraFam[st.fam].invite : P.meta.familyLinks[st.fam];
    stage.appendChild(dev);
    return mountFamily(dev, { invite });
  }
}
function picker(label, opts, cur, on) {
  who.innerHTML = `<div class="px-who"><span>Viewing as</span>${Object.entries(opts).map(([k, l]) => `<button data-k="${k}" aria-pressed="${k === cur}">${l}</button>`).join('')}</div>`;
  who.querySelectorAll('button').forEach(b => b.onclick = () => on(b.dataset.k));
}
// Links inside practice messages open the right view instead of a real page.
async function openLink(url) {
  const u = new URL(url), c = u.searchParams.get('c'), i = u.searchParams.get('i');
  if (c) {
    const home = await api('caregiver', 'home', { link: c });
    const k = home.first_name.toLowerCase().replace(/\W/g, '');
    if (P.meta.caregiverLinks[k] !== c) st.extraCg[k] = { link: c, label: CG[k] || (home.first_name + ' · opened from a message') };
    st.cg = k; st.cgView = (u.hash || '').replace('#', '') || 'home'; st.view = 'caregiver';
  } else if (i) {
    const known = Object.entries(P.meta.familyLinks).find(([, v]) => v === i);
    let k = known ? known[0] : null;
    if (!k) {
      const s = await api('family', 'startSignIn', { invite: i });
      k = s.first_name.toLowerCase().split(/\W/)[0];
      st.extraFam[k] = { invite: i, label: FAM[k] || (s.first_name + ' · new invitation') };
    }
    st.fam = k; st.view = 'family';
  }
  show();
}
function guide() {
  stage.innerHTML = `<div class="px-guide cm">
    <div class="cm-card"><h1 style="font-size:1.7rem">CDS Caregiver Match · Phase 1 practice</h1>
      <p class="cm-sub">This is the real Phase 1 design and server logic running inside your browser, with a practice copy of the database filled with fictional caregivers and families. Nothing here touches the live CDS Hub, GoHighLevel, or anyone's phone. Every message is recorded so you can read the wording, and none is sent.</p></div>
    <div class="cm-card"><h2>Things to try</h2><ol>
      <li><b>Public page:</b> the sample caregiver cards, the short request form with the optional second step, the county counts (fully screened and accepting introductions), and the caregiver sign-up with the FCSR question.</li>
      <li><b>Family · Dale and June:</b> sign in with the code (shown on screen in practice), browse the two sections, filter, open a profile, and ask to meet someone with a live video meet-and-greet.</li>
      <li><b>Office · Introductions:</b> ask the caregiver, then use "Practice: open as the caregiver" to answer yes as them.</li>
      <li><b>Family · My requests:</b> watch the status change at each step.</li>
      <li><b>Office · Caregiver Network:</b> open Denise (new sign-up), mark the office review done, send the profile link, send the registration steps, and walk the screening tracker to "Eligible to begin CDS services". Try recording a result without proof.</li>
      <li><b>Caregiver · Kayla:</b> her profile is waiting for review. Approve it in the office, or ask for a change and see it on her page.</li>
      <li><b>Caregiver · any:</b> change days and times and see families get it right away. Pause introductions or remove the listing and watch the caregiver leave the directory.</li>
      <li><b>Office · Messages:</b> read the exact wording of every message, including the FCSR steps with the two items still to confirm.</li>
    </ol></div>
    <div class="cm-card warn"><h2 style="font-size:1.15rem">What's different from live</h2><ul>
      <li>Photos are drawings and videos are stand-ins. The preview can't use the camera; on the real site the caregiver records on their phone.</li>
      <li>Sign-in codes appear on screen instead of being texted.</li>
      <li>Families' phone and email live in a practice stand-in for GoHighLevel.</li>
      <li>Your practice changes stay in this browser. "Reset practice data" starts over.</li>
    </ul></div>
    <div class="cm-card flat"><h2 style="font-size:1.15rem">Still on hold</h2><ul>
      <li>No invitations to other providers' IHS consumers or to our own IHS consumers until the legal answer comes back.</li>
      <li>Message wording needs your OK, and the FCSR employer name and registration type need the call to FCSR.</li>
      <li>Nothing is deployed. Going live is a separate approval.</li>
    </ul></div>
  </div>`;
}
document.querySelectorAll('.px-nav button').forEach(b => b.onclick = () => { st.view = b.dataset.v; show(); });
let armed = false;
document.getElementById('reset').onclick = async e => {
  if (!armed) { armed = true; e.target.textContent = 'Click again to reset'; setTimeout(() => { armed = false; e.target.textContent = 'Reset practice data'; }, 4000); return; }
  e.target.textContent = 'Resetting…';
  try { Object.keys(localStorage).filter(k => k.startsWith('cds-')).forEach(k => localStorage.removeItem(k)); } catch {}
  await P.reset(); location.reload();
};
show();
</script>
